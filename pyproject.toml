[project]
name = "viral-video-factory-ai"
version = "0.0.1"
description = "Fábrica automatizada de vídeos curtos com IA (TikTok, Reels, YouTube Shorts)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.27,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "diskcache>=5.6,<6",
    "anthropic>=1.15,<2",
    "fal-client>=1.0,<2",
    "replicate>=1.0,<2",
    "faster-whisper>=1.2,<2",
    "av>=18,<19",  # faster-whisper 1.2.x quebra com av>=19 (metadata_errors)
    "numpy>=2,<3",
    "scenedetect>=0.7,<1",
    "opencv-python-headless>=4.10",
    "pysubs2>=1.9,<2",
    "ffmpeg-normalize>=1.43,<2",
]

[project.scripts]
vvf = "vvf.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vvf"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
markers = [
    "cloud: usa serviços pagos; nunca roda por padrão",
    "network: acessa a internet (gratuito); só com VVF_NETWORK_TESTS=1",
    "models: baixa modelos de IA locais; só com VVF_MODEL_TESTS=1",
]
